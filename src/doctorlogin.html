<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Login</title>
    <style>
        h1, h2 {
            font-weight: bold;
            text-align: center;
            margin: 5px;
        }
        label{
            font-weight: bold;
            margin-left: 20px; 
        }
        body{
            background-color: rgb(233, 245, 255);
        }
        #mainhead{
            border: 5px solid gray;
            border-radius: 40px;
        }
        #lgbtn{
            height: auto;
            font-size: 15px;
            border: 2px solid rgb(151, 151, 151);
            border-radius: 20px;
            margin-top: 10px;
            margin-left: 20px;
        }

        .txtinp {
            height: auto;
            font-size: 15px;
            border: 2px solid rgb(151, 151, 151);
            border-radius: 20px;
            padding-left: 15px;
            margin-bottom: 10px;
            margin-left: 20px;
        }
    </style>
</head>

<body>
    <div id = "mainhead">
        <h1>Welcome to e-Health Care Center</h1>
        <h2>Patient Login</h2>
    </div>
    <form action="" method="POST">
        <label for="dname">Name :</label>
        <div>
            <input type="text" name="pname" id="pname" class="txtinp">
        </div>
        <label for="ddept">Department :</label>
        <div>
            <input type="text" name="ddept" id="ddept" class="txtinp">
        </div>
        <label for="dspec">Specialised :</label>
        <div>
            <input type="text" name="dspec" id="spec" class="txtinp">
        </div>
        <label for="pemail">Email :</label>
        <div>
            <input type="email" name="pemail" id="pemail" class="txtinp">
        </div>
        <label for="ppassword">Password :</label>
        <div>
            <input type="text" name="ppassword" id="ppassword" class="txtinp">
        </div>
        <div>
            <input type="submit" value="Login" id="lgbtn">
        </div>
    </form>
</body>

</html>
